name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What are you trying to do, and what makes it hard today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: The behavior or API you would like. Example code helps.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives
          description: Other approaches or workarounds you considered.
