name: Release

# Versions are applied manually with `pnpm run version`. This workflow publishes the
# versions that npm does not have yet: a dry run on pull requests, for real on main.

on:
    pull_request:
    push:
        branches: [main]

permissions: {}

env:
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    dry-run:
        name: Publish (dry run)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run test
            - run: pnpm exec changeset pack --out-dir "$RUNNER_TEMP/pack"

    publish:
        name: Publish
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write # release tags and GitHub releases
            id-token: write # npm trusted publishing
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run test
            - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  script: pnpm run release
