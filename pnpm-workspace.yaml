packages:
    - packages/*

# Shared dependency versions. Reference them with "catalog:" in package.json.
catalog:
    "@arethetypeswrong/core": 0.18.5
    "@changesets/cli": 3.0.3
    "@effect/vitest": 4.1.2
    effect: 4.1.2
    publint: 0.3.25
    turbo: 2.11.10
    typescript: 7.0.2
    vite-plus: 1.5.0

overrides:
    vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
    vitest@*: 5.1.0

# Vite+ replaces vite with @voidzero-dev/vite-plus-core, whose version does not
# match the vite peer range declared by vitest and @vitest/mocker.
peerDependencyRules:
    allowedVersions:
        vite: 1.5.0
