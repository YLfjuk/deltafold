packages:
    - packages/*

# Shared dependency versions. Reference them with "catalog:" in package.json.
catalog:
    "@effect/tsgo": 0.67.7
    "@effect/vitest": 4.1.2
    effect: ^4.1.2
    typescript: 7.0.2
    vite-plus: 1.5.0

minimumReleaseAgeExclude:
    - "@effect/tsgo-darwin-arm64@0.67.7"
    - "@effect/tsgo-darwin-x64@0.67.7"
    - "@effect/tsgo-linux-arm64@0.67.7"
    - "@effect/tsgo-linux-arm@0.67.7"
    - "@effect/tsgo-linux-x64@0.67.7"
    - "@effect/tsgo-win32-arm64@0.67.7"
    - "@effect/tsgo-win32-x64@0.67.7"
    - "@effect/tsgo@0.67.7"

overrides:
    vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
    vitest@*: 5.1.0

# Vite+ replaces vite with @voidzero-dev/vite-plus-core, whose version does not
# match the vite peer range declared by vitest and @vitest/mocker.
peerDependencyRules:
    allowedVersions:
        vite: 1.5.0
